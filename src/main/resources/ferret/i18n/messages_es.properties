about.text=Ferret es un proyecto personal, hecho por gusto: por las tardes y los fines de semana. Sin empresa, sin anuncios, sin recopilar datos: simplemente porque crear tus propias herramientas es divertido. Es gratuito y de código abierto. Si Ferret te resulta útil, dale una estrella en GitHub.
